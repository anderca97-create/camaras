<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="/static/manifest.webmanifest"><title>Fortress CCTV IA</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#07111f;color:#eef6ff}.app{max-width:760px;margin:auto;padding:18px}.hero{padding:20px;border:1px solid #1e3a55;border-radius:22px;background:#0b1a2b}h1{margin:0 0 6px;font-size:25px}.muted{color:#9fb4c8}.grid{display:grid;gap:12px;margin-top:16px}.card{background:#0d2033;border:1px solid #1c3a54;border-radius:18px;padding:15px}label{display:block;font-size:13px;color:#a9bfd1;margin:8px 0 5px}input,select,textarea,button{width:100%;font:inherit;border-radius:12px;padding:12px}input,select,textarea{background:#071827;color:white;border:1px solid #294760}button{border:0;background:#e7f2ff;color:#07111f;font-weight:800;margin-top:10px}.secondary{background:#17344e;color:#eef6ff}.zone{margin-top:12px;border-top:1px solid #23435c;padding-top:12px}.photo{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#050b11}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#17344e;font-size:12px;margin:3px}.result{white-space:pre-wrap;background:#071827;border-radius:12px;padding:12px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="hero"><div class="muted">FORTRESS SMART SECURITY</div><h1>Levantamiento CCTV IA</h1><div class="muted">Proyecto → zona → foto → análisis IA → propuesta → materiales</div></section><section class="grid"><div class="card"><h2>Proyecto</h2><label>Cliente</label><input id="client" placeholder="Nombre del cliente"><label>Sitio</label><input id="site" placeholder="Ubicación / sucursal"><label>Notas generales</label><textarea id="projectNotes" rows="3"></textarea><button onclick="saveProject()">Guardar proyecto</button></div><div class="card"><h2>Nueva zona</h2><label>Nombre de zona</label><input id="zone" placeholder="Ej. Acceso principal"><label>Condición</label><select id="status"><option>Zona a evaluar</option><option>Cámara existente</option><option>Reemplazo</option><option>Nuevo punto</option><option>Reubicación</option></select><label>Observaciones</label><textarea id="notes" rows="3"></textarea><label>Fotografía</label><input id="photo" type="file" accept="image/*" capture="environment"><button onclick="addZone()">Agregar zona</button></div><div class="card"><h2>Zonas del levantamiento</h2><div id="zones"></div></div><div class="card"><h2>Resumen</h2><div class="actions"><button class="secondary" onclick="exportData()">Exportar respaldo JSON</button><button class="secondary" onclick="window.print()">Imprimir / PDF</button></div></div></section></main><script>let project=JSON.parse(localStorage.getItem("fortressProject")||'{"client":"","site":"","projectNotes":"","zones":[]}');function sync(){localStorage.setItem("fortressProject",JSON.stringify(project));render()}function saveProject(){project.client=client.value;project.site=site.value;project.projectNotes=projectNotes.value;sync()}function load(){client.value=project.client||"";site.value=project.site||"";projectNotes.value=project.projectNotes||"";render()}function addZone(){let f=photo.files[0];if(!zone.value||!f){alert("Agrega nombre de zona y fotografía.");return}let r=new FileReader;r.onload=()=>{project.zones.push({id:Date.now(),name:zone.value,status:status.value,notes:notes.value,image:r.result,analysis:null});sync();zone.value="";notes.value="";photo.value=""};r.readAsDataURL(f)}async function analyze(id){let z=project.zones.find(x=>x.id===id);let blob=await(await fetch(z.image)).blob();let fd=new FormData;fd.append("photo",blob,"foto.jpg");fd.append("zone",z.name);fd.append("status",z.status);fd.append("notes",z.notes);let b=document.getElementById("a"+id);b.textContent="Analizando...";try{let res=await fetch("/api/analyze",{method:"POST",body:fd});let data=await res.json();z.analysis=data.analysis||data;sync()}catch(e){alert("No fue posible analizar la foto.")}}function removeZone(id){project.zones=project.zones.filter(x=>x.id!==id);sync()}function render(){zones.innerHTML=project.zones.length?"":"<div class=muted>Aún no hay zonas.</div>";project.zones.forEach(z=>{let d=document.createElement("div");d.className="zone";d.innerHTML='<b>'+esc(z.name)+'</b> <span class=pill>'+esc(z.status)+'</span><p class=muted>'+esc(z.notes||"Sin observaciones")+'</p><img class=photo src="'+z.image+'"><button id="a'+z.id+'" onclick="analyze('+z.id+')">Analizar con IA</button>'+(z.analysis?'<div class=result>'+esc(JSON.stringify(z.analysis,null,2))+'</div>':'')+'<button class=secondary onclick="removeZone('+z.id+')">Eliminar zona</button>';zones.appendChild(d)})}function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:"application/json"}));a.download="levantamiento-cctv.json";a.click()}if("serviceWorker"in navigator)navigator.serviceWorker.register("/static/sw.js");load();</script></body></html>
