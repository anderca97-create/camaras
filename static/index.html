<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="/static/manifest.webmanifest"><title>Fortress Field AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#06111d;color:#eef7ff}button,input,select,textarea{font:inherit}.shell{max-width:920px;margin:auto;padding:14px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}.brand b{font-size:18px}.brand small{display:block;color:#8ba7bd}.badge{padding:7px 10px;border:1px solid #25445d;border-radius:99px;color:#9fc1da}.hero{padding:18px;background:linear-gradient(135deg,#0d263a,#0a1928);border:1px solid #24445e;border-radius:22px}.hero h1{margin:5px 0;font-size:25px}.muted{color:#91aabd}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.tabs button,.btn{border:0;border-radius:13px;padding:12px;background:#17344b;color:#eaf6ff;font-weight:700}.tabs button.on,.primary{background:#e8f4ff!important;color:#07111f!important}.danger{background:#4b2025!important}.card{background:#0b1d2d;border:1px solid #1d3b52;border-radius:19px;padding:15px;margin:11px 0}.card h2,.card h3{margin:0 0 10px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:#9db6c9;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #294a62;background:#061522;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{width:100%;margin-top:8px}.project,.zone{padding:13px;border:1px solid #24445d;border-radius:15px;margin:9px 0;background:#081725}.project{cursor:pointer}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photoGrid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.analysis{background:#061522;border-radius:13px;padding:12px;margin-top:10px}.analysis b{color:#bfe3ff}.chips span{display:inline-block;padding:5px 8px;margin:3px;border-radius:99px;background:#17364f;font-size:12px}.hidden{display:none!important}.empty{text-align:center;padding:25px;color:#87a1b5}.footer{position:fixed;bottom:0;left:0;right:0;background:#071522eF;border-top:1px solid #24445d;padding:8px}.footer div{max-width:920px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:560px){.row{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.photoGrid{grid-template-columns:repeat(2,1fr)}}@media print{.tabs,.footer,.noPrint,.top{display:none!important}body{background:white;color:#111}.card,.hero{background:white;border:1px solid #bbb}.muted{color:#555}.analysis{background:#f5f5f5}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><b>FORTRESS</b><small>Smart Security · Field AI</small></div><span class="badge" id="saveState">Local ✓</span></div><section class="hero"><small class="muted">LEVANTAMIENTO PROFESIONAL</small><h1 id="heroTitle">Proyectos CCTV</h1><div class="muted" id="heroSub">Documenta, analiza y convierte el levantamiento en propuesta.</div></section><nav class="tabs"><button id="tProjects" class="on" onclick="show('projects')">Proyectos</button><button id="tZones" onclick="show('zones')">Zonas</button><button id="tMaterials" onclick="show('materials')">Materiales</button><button id="tReport" onclick="show('report')">Reporte</button></nav>
<section id="projects"><div class="card"><h2>Nuevo proyecto</h2><div class="row"><div class="field"><label>Cliente</label><input id="pClient"></div><div class="field"><label>Sitio / sucursal</label><input id="pSite"></div></div><div class="row"><div class="field"><label>Contacto</label><input id="pContact"></div><div class="field"><label>Técnico</label><input id="pTech" value="Fortress Smart Security"></div></div><div class="field"><label>Objetivo / notas</label><textarea id="pNotes" rows="3"></textarea></div><button class="btn primary" onclick="newProject()">Crear proyecto</button></div><div class="card"><h2>Mis proyectos</h2><div id="projectList"></div></div></section>
<section id="zones" class="hidden"><div id="noProject" class="card empty">Selecciona o crea un proyecto primero.</div><div id="zoneWork" class="hidden"><div class="card"><h2>Nueva zona</h2><div class="row"><div class="field"><label>Nombre</label><input id="zName" placeholder="Acceso principal"></div><div class="field"><label>Condición</label><select id="zStatus"><option>Zona a evaluar</option><option>Cámara existente</option><option>Reemplazo</option><option>Nuevo punto</option><option>Reubicación</option></select></div></div><div class="field"><label>Observaciones de campo</label><textarea id="zNotes" rows="3"></textarea></div><div class="field"><label>Fotos (puedes seleccionar varias)</label><input id="zPhotos" type="file" accept="image/*" capture="environment" multiple></div><button class="btn primary" onclick="addZone()">Guardar zona</button></div><div class="card"><h2>Zonas registradas</h2><div id="zoneList"></div></div></div></section>
<section id="materials" class="hidden"><div class="card"><h2>Materiales y cotización</h2><div class="row"><div class="field"><label>Material / equipo</label><input id="mItem"></div><div class="field"><label>Cantidad</label><input id="mQty" type="number" value="1" min="1"></div></div><div class="row"><div class="field"><label>Precio unitario</label><input id="mPrice" type="number" value="0" min="0" step=".01"></div><div class="field"><label>Modelo / nota</label><input id="mNote"></div></div><button class="btn primary" onclick="addMaterial()">Agregar</button><div id="materialList"></div></div></section>
<section id="report" class="hidden"><div class="card"><h2>Dictamen y reporte</h2><div id="reportBody"></div><div class="row noPrint"><button class="btn" onclick="window.print()">PDF / Imprimir</button><button class="btn" onclick="exportCurrent()">Respaldo JSON</button></div></div></section></main><div class="footer noPrint"><div><button class="btn" onclick="show('zones')">+ Levantar zona</button><button class="btn primary" onclick="show('report')">Ver proyecto final</button></div></div>
<script>
const KEY="fortressFieldAI_v2";let db=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"current":null}');const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(db));$("saveState").textContent="Guardado ✓";render()}function cur(){return db.projects.find(p=>p.id===db.current)}function show(x){["projects","zones","materials","report"].forEach(n=>{$(n).classList.toggle("hidden",n!==x);$("t"+n[0].toUpperCase()+n.slice(1)).classList.toggle("on",n===x)});render()}function newProject(){if(!$("pClient").value.trim())return alert("Escribe el nombre del cliente.");let p={id:Date.now(),client:$("pClient").value.trim(),site:$("pSite").value.trim(),contact:$("pContact").value.trim(),tech:$("pTech").value.trim(),notes:$("pNotes").value.trim(),created:new Date().toLocaleString(),zones:[],materials:[]};db.projects.unshift(p);db.current=p.id;["pClient","pSite","pContact","pNotes"].forEach(x=>$(x).value="");save();show("zones")}function selectProject(id){db.current=id;save();show("zones")}function deleteProject(id){if(confirm("¿Eliminar este proyecto y todo su levantamiento?")){db.projects=db.projects.filter(p=>p.id!==id);if(db.current===id)db.current=null;save()}}async function filesData(files){return Promise.all([...files].map(f=>new Promise((ok,fail)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=fail;r.readAsDataURL(f)})))}async function addZone(){let p=cur();if(!p)return;if(!$("zName").value.trim())return alert("Escribe el nombre de la zona.");let photos=await filesData($("zPhotos").files);p.zones.push({id:Date.now(),name:$("zName").value.trim(),status:$("zStatus").value,notes:$("zNotes").value.trim(),photos,analysis:null});$("zName").value="";$("zNotes").value="";$("zPhotos").value="";save()}async function analyzeZone(id){let p=cur(),z=p.zones.find(x=>x.id===id);if(!z.photos.length)return alert("Esta zona no tiene fotografía.");let b=$("az"+id);b.textContent="Analizando...";try{let blob=await(await fetch(z.photos[0])).blob(),fd=new FormData;fd.append("photo",blob,"zona.jpg");fd.append("zone",z.name);fd.append("status",z.status);fd.append("notes",z.notes);let r=await fetch("/api/analyze",{method:"POST",body:fd}),data=await r.json();if(!r.ok)throw Error(data.detail||data.error);z.analysis=data.analysis||data;save()}catch(e){alert("Análisis IA no disponible: "+e.message);render()}}function deleteZone(id){let p=cur();if(confirm("¿Eliminar zona?")){p.zones=p.zones.filter(z=>z.id!==id);save()}}function addMaterial(){let p=cur();if(!p)return alert("Selecciona un proyecto.");if(!$("mItem").value.trim())return;p.materials.push({id:Date.now(),item:$("mItem").value.trim(),qty:+$("mQty").value||1,price:+$("mPrice").value||0,note:$("mNote").value.trim()});$("mItem").value="";$("mNote").value="";save()}function delMat(id){let p=cur();p.materials=p.materials.filter(m=>m.id!==id);save()}function money(n){return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(n)}function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function analysisHTML(a){if(!a)return'<div class="muted">Sin análisis IA todavía.</div>';return '<div class="analysis"><b>Objetivo</b><div>'+esc(a.objetivo||"")+'</div><br><b>Riesgos</b><div class="chips">'+(a.riesgos||[]).map(x=>'<span>'+esc(x)+'</span>').join("")+'</div><br><b>Cámara recomendada</b><div>'+esc(a.camara||"")+'</div><br><b>Justificación</b><div>'+esc(a.justificacion||"")+'</div><br><b>Montaje / orientación</b><div>'+esc(a.montaje||"")+' · '+esc(a.orientacion||"")+'</div><br><b>Analíticas</b><div class="chips">'+(a.analiticas||[]).map(x=>'<span>'+esc(x)+'</span>').join("")+'</div><br><b>Pendientes de validar</b><div class="chips">'+(a.pendientes||[]).map(x=>'<span>'+esc(x)+'</span>').join("")+'</div></div>'}function render(){let p=cur();$("heroTitle").textContent=p?p.client:"Proyectos CCTV";$("heroSub").textContent=p?(p.site||"Proyecto activo")+" · "+p.zones.length+" zonas":"Documenta, analiza y convierte el levantamiento en propuesta.";$("projectList").innerHTML=db.projects.length?db.projects.map(x=>'<div class="project" onclick="selectProject('+x.id+')"><b>'+esc(x.client)+'</b><div class="muted">'+esc(x.site||"Sin sitio")+' · '+x.zones.length+' zonas · '+esc(x.created)+'</div><button class="btn danger" onclick="event.stopPropagation();deleteProject('+x.id+')">Eliminar</button></div>').join(""):'<div class="empty">Aún no hay proyectos.</div>';$("noProject").classList.toggle("hidden",!!p);$("zoneWork").classList.toggle("hidden",!p);if(p){$("zoneList").innerHTML=p.zones.length?p.zones.map(z=>'<div class="zone"><h3>'+esc(z.name)+' <span class="badge">'+esc(z.status)+'</span></h3><div class="muted">'+esc(z.notes||"Sin observaciones")+'</div><div class="photoGrid">'+z.photos.map(im=>'<img src="'+im+'">').join("")+'</div><button id="az'+z.id+'" class="btn primary" onclick="analyzeZone('+z.id+')">'+(z.analysis?"Reanalizar con IA":"Analizar con IA")+'</button>'+analysisHTML(z.analysis)+'<button class="btn danger" onclick="deleteZone('+z.id+')">Eliminar zona</button></div>').join(""):'<div class="empty">Aún no hay zonas.</div>';let total=p.materials.reduce((s,m)=>s+m.qty*m.price,0);$("materialList").innerHTML=p.materials.map(m=>'<div class="project"><b>'+esc(m.item)+'</b><div>'+m.qty+' × '+money(m.price)+' = <b>'+money(m.qty*m.price)+'</b></div><div class="muted">'+esc(m.note)+'</div><button class="btn danger" onclick="delMat('+m.id+')">Quitar</button></div>').join("")+'<h3>Total: '+money(total)+'</h3>';$("reportBody").innerHTML='<h3>'+esc(p.client)+'</h3><div class="muted">'+esc(p.site)+' · '+esc(p.contact)+'</div><p>'+esc(p.notes)+'</p>'+p.zones.map((z,i)=>'<div class="zone"><h3>'+(i+1)+'. '+esc(z.name)+'</h3><div class="photoGrid">'+z.photos.map(im=>'<img src="'+im+'">').join("")+'</div>'+analysisHTML(z.analysis)+'</div>').join("")+'<h3>Materiales / cotización</h3>'+p.materials.map(m=>'<div>'+m.qty+' × '+esc(m.item)+' — '+money(m.qty*m.price)+'</div>').join("")+'<h2>Total: '+money(total)+'</h2>'}else{$("materialList").innerHTML='<div class="empty">Selecciona un proyecto.</div>';$("reportBody").innerHTML='<div class="empty">Selecciona un proyecto.</div>'}}function exportCurrent(){let p=cur();if(!p)return;let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:"application/json"}));a.download="levantamiento-"+p.client.replace(/\W+/g,"-")+".json";a.click()}if("serviceWorker"in navigator)navigator.serviceWorker.register("/static/sw.js");render();
</script></body></html>
